server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- SPA catch-all: any path that isn't a file goes to index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Health probe for container orchestrators ---
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
