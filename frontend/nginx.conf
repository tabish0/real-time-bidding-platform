server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Proxy API requests to the backend ---
    # Only active when BACKEND_HOST is set to a real container (local Docker).
    # On Railway, VITE_API_BASE_URL is baked into the bundle so /api/ is never hit.
    location /api/ {
        proxy_pass http://${BACKEND_HOST};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Proxy WebSocket (Socket.IO) to the backend ---
    location /socket.io/ {
        proxy_pass http://${BACKEND_HOST};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # --- SPA catch-all: any path that isn't a file goes to index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Health probe for container orchestrators ---
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
